  .choices button.wrong { border-color: var(--viper); background: var(--viper-bg); opacity: 1; }

  .next { font: inherit; font-weight: 700; padding: 6px 16px; border-radius: 10px;

  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: nowrap; padding: 16px 0; }

};
const HINT = {
  zefa:   'צפע. חפשו ראש משולש, גוף עבה וקצר, וזיגזג רציף על הגב.',
  zaaman: 'זעמן. חפשו ראש צר ומוארך, גוף דק וכתמים בשורות ולא זיגזג רציף.'
};
const $ = id => document.getElementById(id);
let order, idx, score, answered;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  order = shuffle(VIPERS.concat(ZAAMANS, VIDEOS)).slice(0, 10);
  idx = 0; score = 0;
  $('qend').classList.add('hidden'); $('qplay').classList.remove('hidden');
  show();
}
function show() {
  answered = false;
  const q = order[idx];
  const m = document.createElement(q.video ? 'video' : 'img');
  m.className = 'qimg'; m.src = q.src;
  if (q.video) { m.muted = true; m.loop = true; m.autoplay = true; m.playsInline = true; m.controls = true; m.setAttribute('aria-label', 'סרטון נחש לזיהוי'); }
  else m.alt = 'נחש לזיהוי';
  $('qmedia').replaceChildren(m);
  $('qnum').textContent = `שאלה ${idx + 1} מתוך ${order.length}`;
  $('qscore').textContent = `ניקוד: ${score}`;
  $('qfb').textContent = q.video ? 'מה אתם רואים בסרטון?' : 'מה אתם רואים בתמונה?';
  $('qnext').classList.add('hidden');
  [$('bViper'), $('bZaaman')].forEach(b => { b.disabled = false; b.className = ''; });
}
function answer(a) {
  if (answered) return; answered = true;
  const q = order[idx], ok = a === q.a;
  if (ok) score++;
  $('bViper').disabled = $('bZaaman').disabled = true;
  (q.a === 'zefa' ? $('bViper') : $('bZaaman')).classList.add('right');
  if (!ok) (a === 'zefa' ? $('bViper') : $('bZaaman')).classList.add('wrong');
  const name = q.a === 'zefa' ? 'צפע' : 'זעמן';
  const note = q.note || NOTES[q.src.replace('img/', '')] || HINT[q.a];
  $('qfb').textContent = (ok ? `✓ נכון, זה ${name}. ` : `✗ לא בדיוק, זה ${name}. `) + note;
  $('qscore').textContent = `ניקוד: ${score}`;
  $('qnext').textContent = idx === order.length - 1 ? 'לתוצאה ←' : 'הבא ←';
  $('qnext').classList.remove('hidden');
}
function next() {
  if (++idx < order.length) return show();
  $('qplay').classList.add('hidden'); $('qend').classList.remove('hidden');
  $('qfinal').textContent = `${score} / ${order.length}`;
  $('qmsg').textContent = score >= 9 ? 'מצוין, עין חדה!' : score >= 6 ? 'לא רע. שווה לחזור על טבלת ההבדלים.' : 'זיהוי נחשים זה קשה. נסו שוב אחרי שתעברו על המדריך.';
}
$('bViper').onclick = () => answer('zefa');
$('bZaaman').onclick = () => answer('zaaman');
$('qnext').onclick = next;
$('qagain').onclick = start;
start();
</script>
